<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Languageballs</title>
    <!-- The tab icon is the ball of the language being learned, drawn from the
         same symbols as the page; the script fills it in. -->
    <link rel="icon" id="favicon" type="image/svg+xml" href="" />
    <link rel="stylesheet" href="/app.css" />
    <script src="/dev/reload.js"></script>
    <style>
      /* Back and forward through the sentences seen so far. Forward past the
         end of the list asks for a new one. */
      .steps {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        margin-top: 2.5rem;
      }
      /* The small Norwegian word is a fiddly target on a touch screen, so a
         proper button gives the same one-letter hint for the word in focus.
         On a keyboard it doubles as the place the shortcut is written down. */
      .hint-row {
        margin-top: 1rem;
      }
      .hint-row button {
        padding: 0.5rem 1rem;
      }
      .hint-row .key {
        margin-left: 0.35rem;
        padding: 0 0.45rem;
        font: inherit;
        font-size: 0.85rem;
        color: var(--ink);
        background: var(--mark);
        border: 1.5px solid var(--line);
        border-radius: var(--wobble-small);
      }
      @media (hover: none), (pointer: coarse) {
        .hint-row .key {
          display: none;
        }
      }
      @media (hover: none), (pointer: coarse) {
        .hint-row button {
          width: 100%;
          padding: 0.7rem 1rem;
        }
      }
      /* The one keyboard shortcut, written beside the speaker it belongs with. */
      .key-help {
        font-size: 0.8rem;
        color: var(--faint);
        white-space: nowrap;
      }
      .key-help kbd {
        padding: 0 0.4rem;
        font: inherit;
        font-size: 0.72rem;
        color: var(--ink);
        background: var(--panel);
        border: 1.5px solid var(--line);
        border-radius: var(--wobble-small);
        box-shadow: 1px 1px 0 var(--line);
      }
      @media (hover: none), (pointer: coarse) {
        .key-help {
          display: none;
        }
      }

      /* Which way round the lesson goes, with a button to swap it. */
      .direction {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1.25rem;
      }
      /* The name leads on the left; the balls and the flip sit on the right. */
      .direction .wordmark {
        order: -1;
        margin-right: auto;
        font-family: var(--hand);
        font-size: 1.7rem;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--ink);
        line-height: 1;
      }
      /* The git hash, small and faint after the name, so a tester can see
         which build they are on. */
      .wordmark .build {
        margin-left: 0.5rem;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 0.7rem;
        font-weight: 400;
        letter-spacing: 0;
        color: var(--muted);
        vertical-align: 0.15em;
      }
      .wordmark .build:empty {
        display: none;
      }
      .direction-label {
        font-family: var(--hand);
        font-size: 1.05rem;
      }
      .flag {
        display: inline-flex;
        line-height: 0;
      }
      .flag svg {
        width: 2.1rem;
        height: 2.1rem;
        overflow: visible;
        transition: transform 0.25s cubic-bezier(0.2, 1.4, 0.4, 1);
      }
      /* The ball you are learning from leans in when the direction is swapped. */
      .direction:hover #flag-to svg {
        transform: rotate(8deg);
      }
      .direction-arrow {
        font-size: 1.1rem;
        color: var(--faint);
      }
      .direction-label {
        margin-left: 0.25rem;
        color: var(--muted);
      }
      @media (max-width: 40rem) {
        .direction-label {
          display: none;
        }
      }
      .flip {
        width: 2.1rem;
        height: 2.1rem;
        padding: 0;
        font-size: 1.1rem;
        line-height: 1;
        border-color: transparent;
      }
      .flip {
        box-shadow: none;
        background: transparent;
      }
      .flip:hover {
        box-shadow: none;
        background: var(--sunk);
      }

      /* One field for both: the level is a small toggle that lives inside the
         topic input, and cycles through the levels on click. */
      .topic-wrap {
        position: relative;
      }
      .topic-wrap input {
        padding-left: 8.6rem;
      }
      /* The level: a painted tag stuck inside the field. */
      .level {
        position: absolute;
        top: 50%;
        left: 0.5rem;
        transform: translateY(-50%) rotate(-1.5deg);
        width: 7.4rem;
        padding: 0.25rem 0.6rem;
        font-size: 0.95rem;
        letter-spacing: 0.01em;
        color: var(--ink);
        background: var(--mark);
        box-shadow: 2px 2px 0 var(--line);
      }
      .level:hover {
        transform: translateY(-50%) rotate(0deg);
        box-shadow: 2px 2px 0 var(--line);
      }
      .level:active {
        transform: translateY(-50%) translate(1px, 1px);
        box-shadow: 1px 1px 0 var(--line);
      }

      /* The word itself stays hidden in the detail panel until it has been
         typed right or asked for; its parts are still described. */
      .hidden-word {
        color: var(--faint);
        letter-spacing: 0.15em;
      }
      .step {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        min-width: 2.9rem;
        height: 2.9rem;
        padding: 0;
      }
      /* Once the sentence is done, the next button grows a word of praise and
         takes the focus, so Enter moves on. */
      .step.ready {
        padding: 0 0.6rem 0 1rem;
        animation: nudge 0.5s cubic-bezier(0.2, 1.6, 0.4, 1);
      }
      .step-label {
        white-space: nowrap;
      }
      @keyframes nudge {
        40% {
          transform: translate(-1px, -1px) scale(1.06);
        }
      }
      /* While a sentence is being made, the play icon gives way to a ring. */
      .spinner {
        display: none;
        width: 1.1rem;
        height: 1.1rem;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      .step.busy .play-icon {
        display: none;
      }
      .step.busy .spinner {
        display: block;
      }
      .step.busy:disabled {
        opacity: 1;
      }
      @keyframes spin {
        to {
          transform: rotate(1turn);
        }
      }
      .step-count {
        min-width: 3.5rem;
        text-align: center;
        font-size: 0.85rem;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }

      /* The comparator ----------------------------------------------------
         Turkish across the top, each word standing over the Norwegian it
         carries. The Norwegian reads in Turkish order, so it comes out
         scrambled — that mismatch is exactly what there is to learn, and the
         natural Norwegian sentence sits underneath to put it back together. */
      .comparator {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 0.75rem 0.6rem;
        padding: 0.5rem 0;
      }
      .chunk {
        display: grid;
        gap: 0.15rem;
        justify-items: start;
        padding: 0.4rem 0.5rem;
        border: 2px solid transparent;
        border-radius: var(--wobble-small);
      }
      .chunk.open {
        background: var(--accent-soft);
        border-color: var(--line);
        box-shadow: 2px 2px 0 var(--line);
      }
      /* The blank to type into: a brush stroke underneath rather than a box,
         so the row still reads as a sentence and not as a form. */
      .chunk .tr {
        display: block;
        padding: 0 0.1rem 0.1rem;
        font-size: 1.4rem;
        letter-spacing: -0.01em;
        line-height: 1.2;
        white-space: pre; /* so a space given as a hint stays visible */
        border-bottom: 3px solid var(--faint);
        border-radius: 0 0 40% 60% / 0 0 6px 4px;
        outline: none;
      }
      .chunk .tr:focus {
        border-bottom-color: var(--teal);
      }
      .chunk.filled .tr {
        border-bottom-color: var(--bad);
      }
      .chunk.correct .tr {
        border-bottom-color: var(--accent);
        color: var(--accent);
      }
      .chunk .no {
        padding: 0;
        font: inherit;
        font-family: var(--hand);
        font-size: 0.95rem;
        color: var(--muted);
        background: transparent;
        border: 0;
        border-radius: 0;
        box-shadow: none;
        cursor: pointer;
      }
      .chunk .no:hover {
        color: var(--ink);
        text-decoration: underline;
        transform: none;
        box-shadow: none;
      }
      .chunk .no:active {
        transform: none;
        box-shadow: none;
      }
      /* A word carrying suffixes is marked with a dotted line under its
         Norwegian, so it is visible at a glance which words have something
         inside them to open up. */
      .chunk.built .no {
        text-decoration: underline dotted var(--accent);
        text-underline-offset: 0.22em;
      }

      /* Placeholders ------------------------------------------------------
         While a sentence is on its way, the row and the card are drawn at
         the size they will be, with shimmering bars where the words go, so
         nothing jumps when the real thing lands. */
      .bone {
        display: inline-block;
        height: 0.9em;
        border-radius: 4px;
        background: linear-gradient(90deg, var(--sunk) 25%, var(--line) 50%, var(--sunk) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.4s linear infinite;
      }
      .chunk.bone-chunk .tr {
        color: transparent;
        border-bottom-color: var(--line);
      }
      .chunk.bone-chunk .no {
        cursor: default;
      }
      .chunk.bone-chunk .no .bone {
        height: 0.75em;
        vertical-align: middle;
      }
      .natural .bone {
        height: 1em;
        vertical-align: middle;
      }
      @keyframes shimmer {
        to {
          background-position: -200% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bone {
          animation: none;
        }
      }

      /* The natural Norwegian sentence stands on its own above the card, so
         the card holds nothing but the Turkish and what it is made of. */
      .natural {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.35rem 0.75rem;
        margin: 2.25rem 0 1rem;
      }
      /* The speaker: the target ball with a couple of sound waves beside it. */
      .speak {
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        gap: 0.15rem;
        height: 2.2rem;
        padding: 0 0.35rem 0 0.1rem;
        color: var(--muted);
        background: transparent;
        border-color: transparent;
        border-radius: 999px;
        box-shadow: none;
      }
      .speak:hover,
      .speak:active {
        box-shadow: none;
        transform: none;
      }
      .speak .flag svg {
        width: 1.7rem;
        height: 1.7rem;
        transition: transform 0.25s cubic-bezier(0.2, 1.4, 0.4, 1);
      }
      .speak:hover {
        background: var(--sunk);
        color: var(--ink);
      }
      .speak:hover .flag svg {
        transform: scale(1.1) rotate(-6deg);
      }
      /* The speaker sits right after the sentence; a long sentence wraps
         inside its own box rather than pushing the speaker off the line. */
      .natural p {
        flex: 0 1 auto;
        min-width: 0;
        margin: 0;
        font-size: 1.15rem;
        line-height: 1.4;
      }
      /* The shortcut note takes the line under the sentence. */
      .natural .key-help {
        flex: 1 0 100%;
        white-space: normal;
      }
      @media (max-width: 40rem) {
        .natural .key-help {
          display: none;
        }
      }

      /* Once the whole sentence is in, every word that has something inside
         it is opened up underneath: root plus suffixes, and the grammar note. */
      #explanations {
        display: grid;
        gap: 1.25rem;
        margin-top: 1.25rem;
        padding-top: 1.25rem;
        border-top: 2px dashed var(--faint);
      }
      #explanations[hidden] {
        display: none;
      }
      .explanation .detail-head {
        gap: 0.2rem 0.6rem;
      }
      .explanation .detail-head .tr {
        font-size: 1.15rem;
        font-weight: 600;
      }
      .explanation .morphemes {
        margin-top: 0.5rem;
      }
      .explanation .note {
        margin-top: 0.6rem;
        font-size: 0.95rem;
      }

      /* The detail panel for whichever word is selected ------------------- */
      /* Hidden for now: the breakdown is still rendered, so bringing it back
         is a matter of dropping this rule. */
      #detail {
        display: none;
        margin-top: 1.15rem;
        padding-top: 1.15rem;
        border-top: 1px solid var(--line);
      }
      .detail-head {
        display: flex;
        flex-wrap: wrap;
        gap: 0.2rem 0.75rem;
        align-items: baseline;
      }
      .detail-head .tr {
        font-size: 1.3rem;
      }
      .detail-head .no {
        color: var(--muted);
      }

      /* The word taken apart: root, then each suffix, with what it does. */
      .morphemes {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 0.35rem 0.2rem;
        margin-top: 0.9rem;
      }
      .morpheme {
        display: grid;
        gap: 0.1rem;
        padding: 0.35rem 0.6rem;
        background: var(--sunk);
        border: 2px solid var(--line);
        border-radius: var(--wobble-small);
        box-shadow: 2px 2px 0 var(--line);
      }
      .morpheme .form {
        font-weight: 600;
      }
      .morpheme .means {
        font-size: 0.78rem;
        color: var(--muted);
      }
      .joint {
        padding-bottom: 0.4rem;
        color: var(--faint);
      }

      .note {
        margin: 0.9rem 0 0;
        padding-left: 0.85rem;
        border-left: 4px solid var(--ochre);
        border-radius: 3px 0 0 3px;
      }

      .detail-actions {
        margin: 1rem 0 0;
      }
      .hint-text {
        font-size: 0.8rem;
        color: var(--faint);
      }

      /* Word bank -------------------------------------------------------- */
      #bank {
        margin-top: 3.5rem;
      }
      #bank header {
        display: flex;
        gap: 1rem;
        align-items: center;
      }
      /* The bar: an ink-edged trough with a painted fill, in 25 steps. */
      /* One line with the chest: the bar carries its own count, and the
         full-chest tally sits after it, all on the chest's centre line. */
      .progress {
        flex: 1 1 auto;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .progress-bar {
        position: relative;
        flex: 1 1 auto;
        height: 1.7rem;
        background: var(--panel);
        border: 2px solid var(--line);
        border-radius: var(--wobble-small);
        box-shadow: 3px 3px 0 var(--line);
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        width: 0;
        background: var(--ochre);
        border-right: 2px solid var(--line);
        transition: width 0.5s cubic-bezier(0.2, 1.2, 0.4, 1);
      }
      /* Tick marks every five words. */
      .progress-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
          90deg,
          transparent 0,
          transparent calc(20% - 1px),
          var(--faint) calc(20% - 1px),
          var(--faint) 20%
        );
        opacity: 0.5;
        pointer-events: none;
      }
      .progress-text {
        display: contents;
        font-family: var(--hand);
        font-size: 0.95rem;
        color: var(--muted);
      }
      /* The count rides inside the bar; the tally of full chests follows it. */
      .progress-count {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--hand);
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--ink);
        pointer-events: none;
      }
      .progress-full {
        flex: 0 0 auto;
        font-family: var(--hand);
        font-size: 0.95rem;
        color: var(--muted);
        white-space: nowrap;
      }
      .progress-full:empty {
        display: none;
      }
      #bank h2 {
        flex: 0 0 auto;
      }
      .group {
        flex: 0 0 auto;
        width: auto;
        padding: 0.35rem 0.6rem;
        font-family: var(--hand);
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
      }
      @media (max-width: 40rem) {
        #bank header {
          flex-wrap: wrap;
        }
        .group {
          flex: 1 0 100%;
        }
      }
      #bank h2 {
        --chest-line: var(--line);
        --chest-lid: #b8743f;
        --chest-light: #d9a06a;
        --chest-body: #8c4f2b;
        --chest-latch: var(--ochre);
        display: inline-flex;
        align-items: center;
        margin: 0 auto 0 0;
      }
      .chest {
        display: block;
        filter: drop-shadow(3px 3px 0 var(--line));
        transition: transform 0.2s cubic-bezier(0.2, 1.4, 0.4, 1);
      }
      /* An invisible button laid over the chest, so the drawing is the control. */
      .chest-toggle {
        position: absolute;
        inset: -0.25rem;
        z-index: 1;
        padding: 0;
        background: transparent;
        border-color: transparent;
        box-shadow: none;
        border-radius: 12px;
        cursor: pointer;
      }
      .chest-toggle:hover,
      .chest-toggle:active {
        transform: none;
        box-shadow: none;
      }
      .chest-wrap:hover .chest {
        transform: translateY(-2px) rotate(-2deg);
      }
      .chest-wrap[data-open='true'] .chest {
        transform: rotate(2deg);
      }
      @media (prefers-color-scheme: dark) {
        #bank h2 {
          --chest-lid: #c48450;
          --chest-light: #e2b17e;
          --chest-body: #9a5a32;
        }
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      /* The tally, painted on the chest's front in the latch's gold. */
      .bank-count {
        position: absolute;
        left: 50%;
        top: 70%;
        transform: translate(-50%, -50%);
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 1.05rem;
        font-weight: 800;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
        color: var(--chest-latch, #e9c46a);
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
        pointer-events: none;
      }
      /* The words as badges: painted tags that wrap across the row, each
         with the word, its gloss underneath, a tally, and a tiny remove. */
      .bank-list {
        display: flex;
        flex-wrap: wrap;
        gap: 0.7rem 0.6rem;
        margin: 1.25rem 0 0;
        padding: 0;
        list-style: none;
      }
      .bank-list li {
        position: relative;
        display: grid;
        grid-template-columns: auto auto;
        grid-template-rows: auto auto;
        column-gap: 0.4rem;
        align-items: baseline;
        padding: 0.35rem 1.7rem 0.4rem 0.75rem;
        background: var(--panel);
        border: 2px solid var(--line);
        border-radius: var(--wobble-small);
        box-shadow: 3px 3px 0 var(--line);
        transform: rotate(var(--tilt, 0deg));
      }
      /* Every other badge leans a touch the other way, like stickers. */
      .bank-list li:nth-child(3n + 1) {
        --tilt: -1deg;
      }
      .bank-list li:nth-child(3n) {
        --tilt: 1deg;
      }
      .bank-list .tr {
        grid-column: 1;
        font-size: 1.05rem;
        font-weight: 700;
      }
      .bank-list .no {
        grid-column: 1 / -1;
        grid-row: 2;
        font-family: var(--hand);
        font-size: 0.85rem;
        line-height: 1.2;
        color: var(--muted);
      }
      .bank-list .tally {
        grid-column: 2;
        grid-row: 1;
        font-size: 0.75rem;
        font-variant-numeric: tabular-nums;
        color: var(--faint);
      }
      .bank-list button {
        position: absolute;
        top: 0.15rem;
        right: 0.15rem;
        width: 1.15rem;
        height: 1.15rem;
        padding: 0;
        font-size: 0.85rem;
        line-height: 1;
        color: var(--muted);
        background: transparent;
        border-color: transparent;
        box-shadow: none;
        opacity: 0.5;
      }
      .bank-list li:hover button {
        opacity: 1;
      }
      /* Rarity, by how many pieces the word is built from. */
      .bank-list li.sjelden {
        background: color-mix(in srgb, var(--teal) 18%, var(--panel));
      }
      .bank-list li.episk {
        background: color-mix(in srgb, #7c5cbf 22%, var(--panel));
      }
      .bank-list li.legendarisk {
        background: color-mix(in srgb, var(--ochre) 45%, var(--panel));
        box-shadow:
          3px 3px 0 var(--line),
          0 0 0 3px color-mix(in srgb, var(--ochre) 45%, transparent);
      }
      .bank-list li.legendarisk .tr {
        color: var(--accent);
      }
      .bank-list button:hover,
      .bank-list button:active {
        color: var(--bad);
        background: var(--sunk);
        transform: none;
        box-shadow: none;
      }

      /* Fireworks -------------------------------------------------------
         A word earned outright sends a burst of emoji out of the chest, and
         the chest gives a little hop. Each piece is scattered by custom
         properties set when it is made, so the CSS stays one keyframe. */
      .chest-wrap {
        position: relative;
      }
      .fireworks {
        position: absolute;
        top: 50%;
        left: 50%;
        pointer-events: none;
      }
      .fireworks span {
        position: absolute;
        font-size: var(--s);
        line-height: 1;
        transform: translate(-50%, -50%);
        opacity: 0;
        animation: firework 1.3s cubic-bezier(0.1, 0.8, 0.3, 1) var(--d) both;
      }
      .fireworks span svg {
        width: 1em;
        height: 1em;
        display: block;
      }
      .chest.hop {
        animation: chest-hop 0.6s cubic-bezier(0.2, 1.6, 0.4, 1);
      }
      @keyframes firework {
        0% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(0.4) rotate(0);
        }
        70% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1) rotate(var(--r));
        }
      }
      @keyframes chest-hop {
        30% {
          transform: translateY(-8px) rotate(-6deg);
        }
        60% {
          transform: translateY(0) rotate(3deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .fireworks span,
        .chest.hop {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <!-- Which way round: the flag on the left is the language you know, the
           one on the right is the language you are learning. -->
      <div class="direction">
        <span class="flag" id="flag-from" aria-hidden="true"></span>
        <span class="direction-arrow" aria-hidden="true">→</span>
        <span class="flag" id="flag-to" aria-hidden="true"></span>
        <span class="direction-label" id="direction-label"></span>
        <button type="button" id="flip" class="flip ghost" aria-label="Bytt retning" title="Bytt retning">⇄</button>
        <span class="wordmark" aria-hidden="true">Languageballs<small class="build" id="build"></small></span>
      </div>

      <!-- Norwayball and Turkeyball: the flags as countryballs, drawn rather
           than typed since Windows has no flag emoji. Both share one set of
           eyes, so they look like the same two characters. -->
      <svg width="0" height="0" style="position: absolute" aria-hidden="true">
        <clipPath id="ball-clip"><circle cx="20" cy="20" r="18" /></clipPath>
        <g id="ball-eyes">
          <ellipse cx="14.5" cy="17" rx="4.2" ry="5" fill="#fff" stroke="#111" stroke-width="1.6" />
          <ellipse cx="26.5" cy="17" rx="4.2" ry="5" fill="#fff" stroke="#111" stroke-width="1.6" />
        </g>
        <symbol id="flag-no" viewBox="0 0 40 40">
          <g clip-path="url(#ball-clip)">
            <rect width="40" height="40" fill="#ba0c2f" />
            <path d="M9 0h9v40H9zM0 16h40v8H0z" fill="#fff" />
            <path d="M11.5 0h4v40h-4zM0 18h40v4H0z" fill="#00205b" />
          </g>
          <circle cx="20" cy="20" r="18" fill="none" stroke="#111" stroke-width="2.2" />
          <use href="#ball-eyes" />
        </symbol>
        <symbol id="flag-tr" viewBox="0 0 40 40">
          <g clip-path="url(#ball-clip)">
            <rect width="40" height="40" fill="#e30a17" />
            <circle cx="15" cy="27" r="7" fill="#fff" />
            <circle cx="17" cy="27" r="5.6" fill="#e30a17" />
            <path d="M24.5 27l4.6-1.5-2.9 3.9v-4.8l2.9 3.9z" fill="#fff" />
          </g>
          <circle cx="20" cy="20" r="18" fill="none" stroke="#111" stroke-width="2.2" />
          <use href="#ball-eyes" />
        </symbol>
      </svg>

      <form id="form">
        <div class="topic-wrap">
          <button type="button" id="level" class="level" aria-label="Nivå: Nybegynner" title="Bytt nivå">
            Nybegynner
          </button>
          <input id="topic" aria-label="Tema" placeholder="Tema: på kafé, familie, å reise…" />
        </div>
      </form>

      <p id="status" class="status" hidden></p>

      <div class="natural" id="natural-row" hidden>
        <p id="natural" lang="nb"></p>
        <!-- The ball of the language being learned does the talking. -->
        <button type="button" id="speak" class="speak" aria-label="Les opp setningen" title="Les opp setningen">
          <span class="flag" id="speak-ball" aria-hidden="true"></span>
          <svg class="waves" viewBox="0 0 12 16" width="9" height="12" aria-hidden="true" focusable="false">
            <path d="M2 5.5a4 4 0 0 1 0 5M5.5 3a8 8 0 0 1 0 10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
        <span class="key-help" id="key-help"></span>
      </div>

      <article id="lesson" class="card" hidden>
        <div class="comparator" id="comparator"></div>
        <div class="hint-row">
          <button type="button" id="hint" class="ghost">Hint: én bokstav <kbd class="key">.</kbd></button>
        </div>
        <div id="detail"></div>
        <div id="explanations" hidden></div>
      </article>

      <div class="steps" role="group" aria-label="Bla i setninger">
        <button type="button" id="back" class="step ghost" aria-label="Forrige setning" title="Forrige setning" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
            <path d="M16 4.5v15l-12-7.5z" fill="currentColor" />

        <span class="step-count" id="step-count" aria-live="polite"></span>
        <button id="submit" type="submit" form="form" class="step" aria-label="Neste setning" title="Neste setning">

          <svg class="play-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">

      <section id="bank">
        <header>
          <h2 class="chest-wrap">
            <!-- The chest itself is the toggle: closed shows the newest few
                 words, open shows a whole chest at a time. -->
            <button type="button" id="chest-toggle" class="chest-toggle" aria-expanded="false" aria-controls="bank-list"></button>
            <span class="fireworks" id="fireworks" aria-hidden="true"></span>
            <!-- The tally sits on the front of the chest, so the body is kept
                 clear: bands only on the lid, and a small latch at its edge. -->
            <!-- Painted like the rest: ink outline with a little wobble, flat
                 gouache fills, and a hard cut-out shadow from CSS. -->
            <svg class="chest" id="chest" viewBox="0 0 60 50" width="66" height="55" aria-hidden="true" focusable="false">
              <!-- body -->
              <path d="M5 21 Q3.5 32 5.5 45 Q30 47.5 54.5 45 Q56.5 32 55 21 Z" fill="var(--chest-body)" stroke="var(--chest-line)" stroke-width="2.4" stroke-linejoin="round" />
              <!-- lid -->
              <path d="M4.5 21.5 C3 9 14 2.5 30 2.5 S57 9 55.5 21.5 Q30 23.5 4.5 21.5 Z" fill="var(--chest-lid)" stroke="var(--chest-line)" stroke-width="2.4" stroke-linejoin="round" />
              <path d="M18.5 4.2 Q17.3 12.5 18.2 21.6 M41.5 4.2 Q42.7 12.5 41.8 21.6" fill="none" stroke="var(--chest-line)" stroke-width="2" stroke-linecap="round" />
              <!-- a lighter brush stroke along the lid's top -->
              <path d="M12 10 Q30 5 48 10" fill="none" stroke="var(--chest-light)" stroke-width="2.2" stroke-linecap="round" />
              <!-- latch, on the lid's edge -->
              <path d="M24.5 17.5 h11 q1.5 0 1.5 1.5 v5.5 q0 1.5 -1.5 1.5 h-11 q-1.5 0 -1.5 -1.5 v-5.5 q0 -1.5 1.5 -1.5 z" fill="var(--chest-latch)" stroke="var(--chest-line)" stroke-width="2" stroke-linejoin="round" />
              <circle cx="30" cy="21.5" r="1.3" fill="var(--chest-line)" />
            </svg>
            <span class="sr-only">Ordbank</span>
            <span class="bank-count" id="bank-count"></span>
          </h2>
          <!-- Progress towards the next 25 words. Each full 25 is a chest
               filled, and the bar starts over. -->
          <div class="progress" id="progress">
            <div class="progress-bar" role="progressbar" aria-valuemin="0" aria-valuemax="25" aria-valuenow="0" id="progress-bar">
              <div class="progress-fill" id="progress-fill"></div>
              <span class="progress-count" id="progress-count"></span>
            </div>
            <span class="progress-full" id="progress-full"></span>
          </div>
          <!-- Which chest's words are listed below. Only shown once there is
               more than one chest to choose from. -->
          <select id="group" class="group" aria-label="Kiste" hidden></select>
        </header>
        <ul class="bank-list" id="bank-list"></ul>
      </section>
    </main>


    <script type="module">
      const form = document.querySelector('#form');
      const levelButton = document.querySelector('#level');
      const topicField = document.querySelector('#topic');
      const submitButton = document.querySelector('#submit');
      const backButton = document.querySelector('#back');
      const stepCount = document.querySelector('#step-count');
      const stepLabel = document.querySelector('#step-label');
      const statusLine = document.querySelector('#status');
      const lessonCard = document.querySelector('#lesson');
      const comparator = document.querySelector('#comparator');
      const hintButton = document.querySelector('#hint');
      const naturalRow = document.querySelector('#natural-row');
      const naturalLine = document.querySelector('#natural');
      const speakButton = document.querySelector('#speak');
      const speakBall = document.querySelector('#speak-ball');
      const keyHelp = document.querySelector('#key-help');
      const detail = document.querySelector('#detail');
      const explanations = document.querySelector('#explanations');
      const bank = document.querySelector('#bank');
      const bankList = document.querySelector('#bank-list');
      const bankCount = document.querySelector('#bank-count');
      const progressBar = document.querySelector('#progress-bar');
      const progressFill = document.querySelector('#progress-fill');
      const progressCount = document.querySelector('#progress-count');
      const progressFull = document.querySelector('#progress-full');
      const groupSelect = document.querySelector('#group');
      const chestToggle = document.querySelector('#chest-toggle');
      const chestWrap = document.querySelector('.chest-wrap');
      /** Which chest is listed; -1 means the one being filled. */
      let viewGroup = -1;
      /** Closed: the newest few words. Open: a whole chest, with the picker. */
      let chestOpen = false;
      const PEEK = 5;

      /** Rarity by pieces: a bare word is common, a word of four or more
          pieces is legendary. Old entries without a count are common. */
      function rarityOf(pieces) {
        if (pieces >= 4) return 'legendarisk';
        if (pieces === 3) return 'episk';
        if (pieces === 2) return 'sjelden';
        return 'vanlig';
      }

      chestToggle.addEventListener('click', () => {
        chestOpen = !chestOpen;
        renderBank(loadBank());
      });
      /** Words per chest: the bar fills to here and starts over. */
      const CHEST_SIZE = 25;
      const chest = document.querySelector('#chest');
      const fireworksBox = document.querySelector('#fireworks');
      const flagFrom = document.querySelector('#flag-from');
      const flagTo = document.querySelector('#flag-to');
      const directionLabel = document.querySelector('#direction-label');
      const flipButton = document.querySelector('#flip');

      /* Direction ---------------------------------------------------------
         "tr": a Norwegian speaker learning Turkish. "nb": a Turkish speaker
         learning Norwegian. Everything on the page is written in the language
         the learner already knows, and the blanks are in the other one. */

      const DIRECTIONS = {
        tr: {
          target: 'tr',
          native: 'nb',
          targetLocale: 'tr-TR',
          flagFrom: 'flag-no',
          flagTo: 'flag-tr',
          label: 'Jeg lærer tyrkisk',
          title: 'Languageballs — lær tyrkisk',
          levels: [
            ['nybegynner', 'Nybegynner'],
            ['viderekommen', 'Viderekommen'],
            ['avansert', 'Avansert'],
          ],
          levelLabel: 'Nivå',
          switchLevel: 'Bytt nivå',
          topic: 'Tema',
          topicPlaceholder: 'Tema: på kafé, familie, å reise…',
          defaultTopic: 'hunder',
          flip: 'Bytt retning: lær norsk fra tyrkisk',
          speak: 'Les opp setningen',
          keyHelp: ['leser ordet du står i', 'hele setningen'],
          hint: 'Hint: én bokstav',
          hintWord: 'Hint: én bokstav til',
          blankFor: (native) => `Tyrkisk for «${native}»`,
          prev: 'Forrige setning',
          next: 'Neste setning',
          done: 'Flott! Neste',
          fresh: 'Ny setning',
          browse: 'Bla i setninger',
          bank: 'Ordbank',
          chest: 'Kiste',
          chestOpen: 'Åpne kisten og vis alle ordene',
          chestClose: 'Lukk kisten',
          chestsFull: (n) => (n === 1 ? '1 kiste full' : `${n} kister fulle`),
          inBank: 'Ligger i ordbanken',
          tally: 'Ganger skrevet riktig uten hjelp',
          remove: (word) => `Fjern ${word}`,
          noBreakdown:
            'Setningen kom, men oppdelingen stemte ikke med den, så den er utelatt. Prøv en gang til.',
          failed: 'Noe gikk galt.',
          offline: 'Fikk ikke kontakt med serveren.',
        },
        nb: {
          target: 'nb',
          native: 'tr',
          targetLocale: 'nb-NO',
          flagFrom: 'flag-tr',
          flagTo: 'flag-no',
          label: 'Norveççe öğreniyorum',
          title: 'Languageballs — Norveççe öğren',
          levels: [
            ['nybegynner', 'Başlangıç'],
            ['viderekommen', 'Orta'],
            ['avansert', 'İleri'],
          ],
          levelLabel: 'Seviye',
          switchLevel: 'Seviyeyi değiştir',
          topic: 'Konu',
          topicPlaceholder: 'Konu: kafede, aile, seyahat…',
          defaultTopic: 'köpekler',
          flip: 'Yönü değiştir: Norveççeden Türkçe öğren',
          speak: 'Cümleyi seslendir',
          keyHelp: ['bulunduğun kelimeyi okur', 'tüm cümleyi'],
          hint: 'İpucu: bir harf',
          hintWord: 'İpucu: bir harf daha',
          blankFor: (native) => `«${native}» için Norveççe`,
          prev: 'Önceki cümle',
          next: 'Sonraki cümle',
          done: 'Harika! Sıradaki',
          fresh: 'Yeni cümle',
          browse: 'Cümleler arasında gez',
          bank: 'Kelime sandığı',
          chest: 'Sandık',
          chestOpen: 'Sandığı aç ve tüm kelimeleri göster',
          chestClose: 'Sandığı kapat',
          chestsFull: (n) => `${n} sandık dolu`,
          inBank: 'Sandıkta var',
          tally: 'Yardımsız doğru yazma sayısı',
          remove: (word) => `${word} kelimesini kaldır`,
          noBreakdown:
            'Cümle geldi ama parçalara ayırma cümleyle uyuşmadı, o yüzden gösterilmedi. Bir daha dene.',
          failed: 'Bir şeyler ters gitti.',
          offline: 'Sunucuya ulaşılamadı.',
        },
      };

      const DIRECTION_KEY = 'potets.retning';
      /** How many sentences are kept; the oldest fall off the front. */
      const HISTORY_LIMIT = 100;

      let learning = recall(DIRECTION_KEY) === 'nb' ? 'nb' : 'tr';
      /** The strings and settings for the current direction. */
      let D = DIRECTIONS[learning];

      /** Storage is per direction, so each side keeps its own sentences and chest. */
      function keyFor(name) {
        // The Turkish-learning keys keep their old names, so nothing saved
        // before there were two directions is lost.
        return learning === 'tr' ? `potets.tyrkisk.${name}` : `potets.norsk.${name}`;
      }

      /** The lesson on screen, and which of its chunks is open. */
      let current = { chunks: [] };
      let selected = -1;
      /** Every sentence seen, oldest first, and which one is on screen. */
      let history = [];
      let cursor = -1;
      /** Sequence number, so a slow answer cannot overwrite a newer one. */
      let pending = 0;

      function setStatus(message, isError = false) {
        statusLine.textContent = message ?? '';
        statusLine.hidden = !message;
        statusLine.classList.toggle('error', Boolean(isError));
      }

      /* Storage ---------------------------------------------------------- */

      /** Reading and writing both throw in a browser set to block site data. */
      function remember(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch {
          // A saved word is a convenience; the page works without one.
        }
      }

      function recall(key) {
        try {
          return localStorage.getItem(key);
        } catch {
          return null;
        }
      }

      /** Entries saved before the rename carried turkish/norwegian fields. */
      function upgrade(entry) {
        if (!entry || typeof entry !== 'object') return entry;
        if (entry.target !== undefined) return entry;
        if (entry.turkish === undefined) return entry;
        const { turkish, norwegian, chunks, ...rest } = entry;
        return {
          ...rest,
          target: turkish,
          native: norwegian,
          ...(Array.isArray(chunks) ? { chunks: chunks.map(upgrade) } : {}),
        };
      }

      function loadBank() {
        try {
          const parsed = JSON.parse(recall(keyFor('ordbank')) ?? '[]');
          return Array.isArray(parsed) ? parsed.map(upgrade).filter((entry) => entry?.target) : [];
        } catch {
          return [];
        }
      }

      function saveBank(words) {
        remember(keyFor('ordbank'), JSON.stringify(words));
        renderBank(words);
      }

      function loadHistory() {
        try {
          const parsed = JSON.parse(recall(keyFor('historikk')) ?? '[]');
          return Array.isArray(parsed)
            ? parsed.map(upgrade).filter((entry) => entry?.target && Array.isArray(entry.chunks))
            : [];
        } catch {
          return [];
        }
      }

      function saveHistory() {
        remember(keyFor('historikk'), JSON.stringify(history));
      }

      /* Stepping through the history ------------------------------------- */

      function updateSteps() {
        backButton.disabled = cursor <= 0;
        stepCount.textContent = history.length ? `${cursor + 1} / ${history.length}` : '';
        submitButton.setAttribute('aria-label', cursor < history.length - 1 ? D.next : D.fresh);
        submitButton.title = submitButton.getAttribute('aria-label');
      }

      function showAt(index) {
        cursor = index;
        renderLesson(history[index]);
        setStatus('');
        updateSteps();
      }

      backButton.addEventListener('click', () => {
        if (cursor > 0) showAt(cursor - 1);
      });

      /* The comparator --------------------------------------------------- */

      /** A word counts as solved once the field holds it, typed or hinted. */
      function isSolved(index) {
        return Boolean(comparator.children[index]?.classList.contains('correct'));
      }

      /** One more letter of the answer than is already right at the start. */
      function hint(index) {
        const chunk = current.chunks[index];
        const box = comparator.children[index];
        const field = box.querySelector('.tr');
        box.classList.add('helped');
        const answer = chunk.target;
        // Keep a trailing space: in a multi-word chunk it is the letter that
        // was just given, and trimming it would hand out the same space again.
        const typed = field.textContent.replace(/\u00a0/g, ' ').trimStart();
        const same = (a, b) => (/\s/.test(a) ? /\s/.test(b) : fold(a) === fold(b));
        let right = 0;
        while (right < typed.length && right < answer.length && same(typed[right], answer[right])) {
          right += 1;
        }
        field.textContent = answer.slice(0, Math.min(answer.length, right + 1));
        checkField(field, chunk);
        placeCaretAtEnd(field);
      }

      function placeCaretAtEnd(field) {
        field.focus();
        const range = document.createRange();
        range.selectNodeContents(field);
        range.collapse(false);
        const selection = getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      }

      function select(index) {
        selected = index;
        for (const [at, box] of [...comparator.children].entries()) {
          box.classList.toggle('open', at === index);
        }
        renderDetail(current.chunks[index]);
      }

      // The hint button works on the selected word, or failing that the
      // first one still open, which is where the caret sits anyway.
      hintButton.addEventListener('click', () => {
        let index = selected >= 0 && !isSolved(selected) ? selected : -1;
        if (index < 0) index = [...comparator.children].findIndex((box) => !box.classList.contains('correct'));
        if (index < 0 || !current.chunks[index]) return;
        select(index);
        hint(index);
        if (isSolved(index)) focusNextOpen();
      });

      /** After help, the caret goes to the first blank still to be done. */
      function focusNextOpen() {
        const box = [...comparator.children].find((candidate) => !candidate.classList.contains('correct'));
        const field = box?.querySelector('.tr');
        if (field) placeCaretAtEnd(field);
      }

      /** Letters folded to their plain Latin base, so ş and s, ı and i, ğ and
          g, ö and o, ü and u, ç and c, æ and a, ø and o, å and a all count
          the same. The point is the word and its order, not the keyboard. */
      function fold(text) {
        return text
          .trim()
          .toLocaleLowerCase('tr')
          .replace(/ı/g, 'i')
          .replace(/æ/g, 'a')
          .replace(/ø/g, 'o')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .replace(/[’'`´]/g, '')
          // Punctuation the model left glued to a word is not part of the
          // spelling, and the full stop is the hint key besides.
          .replace(/[.,;:!?…]/g, '')
          .replace(/\s+/g, ' ');
      }

      function sameWord(typed, answer) {
        return fold(typed) === fold(answer);
      }

      function checkField(field, chunk) {
        const typed = field.textContent;
        const box = field.parentElement;
        const wasSolved = box.classList.contains('correct');
        box.classList.toggle('correct', sameWord(typed, chunk.target));
        box.classList.toggle('filled', typed.trim().length > 0);
        const solvedNow = box.classList.contains('correct');
        if (solvedNow === wasSolved) return;

        // A near-miss on the letters still counts, but the word left on screen
        // is the real spelling: ş where s was typed, ø where o was.
        if (solvedNow && typed.trim() !== chunk.target) field.textContent = chunk.target;

        // Earned outright — no hint, not shown — so it goes in the bank, and
        // the list jumps to the chest it landed in.
        if (solvedNow && !box.classList.contains('helped')) {
          viewGroup = -1;
          bankEarned(chunk);
        }
        // Getting it right unmasks the word in the panel underneath.
        if (current.chunks[selected] === chunk) renderDetail(chunk);
        // The last word in opens up the whole sentence and hands the focus to
        // the next button, so Enter carries on.
        if (sentenceDone()) {
          renderExplanations();
          setReady(true);
          submitButton.focus();
        } else {
          explanations.hidden = true;
          setReady(false);
        }
      }

      function setReady(ready) {
        submitButton.classList.toggle('ready', ready);
        stepLabel.hidden = !ready;
        stepLabel.textContent = ready ? D.done : '';
        // Nothing left to hint at once every word is in place.
        hintButton.parentElement.hidden = ready;
      }

      /** The chunk: a blank field to type the target word into, standing over
          the native words it should carry. The native text is the button that
          gives one letter at a time. */
      function chunkField(chunk, index) {
        const box = document.createElement('div');
        box.className = chunk.morphemes?.length ? 'chunk built' : 'chunk';

        const field = document.createElement('span');
        field.className = 'tr';
        field.lang = D.target;
        field.contentEditable = 'plaintext-only';
        field.spellcheck = false;
        field.setAttribute('role', 'textbox');
        field.setAttribute('aria-label', D.blankFor(chunk.native));
        // Sized to the answer so the row does not shift as it is filled in.
        field.style.minWidth = `${Math.max(2, chunk.target.length)}ch`;

        // The last right letter moves the caret on, so a sentence can be typed
        // straight through without reaching for Enter.
        field.addEventListener('input', () => {
          checkField(field, chunk);
          if (isSolved(index)) focusNextOpen();
        });
        // Enter and Tab both step to the next blank, skipping the buttons in
        // between; Shift+Tab steps back.
        field.addEventListener('keydown', (event) => {
          if (event.key !== 'Enter' && event.key !== 'Tab') return;
          const step = event.key === 'Tab' && event.shiftKey ? -1 : 1;
          const next = comparator.children[index + step]?.querySelector('.tr');
          if (!next && event.key === 'Tab') return;
          event.preventDefault();
          if (next) placeCaretAtEnd(next);
          else field.blur();
        });
        field.addEventListener('focus', () => select(index));

        const native = document.createElement('button');
        native.type = 'button';
        native.className = 'no';
        native.lang = D.native;
        native.textContent = chunk.native;
        native.title = D.hintWord;
        native.tabIndex = -1;
        // Each click gives one more letter; the last one completes the word.
        native.addEventListener('click', () => {
          select(index);
          hint(index);
          if (isSolved(index)) focusNextOpen();
        });

        box.append(field, native);
        return box;
      }

      function morphemeNode({ form, means }, solved) {
        const piece = document.createElement('span');
        piece.className = 'morpheme';

        const formNode = document.createElement('span');
        formNode.className = 'form';
        formNode.lang = D.target;
        if (solved) formNode.textContent = form;
        else formNode.append(masked(form));

        const meansNode = document.createElement('span');
        meansNode.className = 'means';
        meansNode.lang = D.native;
        meansNode.textContent = means;

        piece.append(formNode, meansNode);
        return piece;
      }

      /** Dots standing in for a word not yet earned, one per letter. */
      function masked(word) {
        const span = document.createElement('span');
        span.className = 'hidden-word';
        span.textContent = '·'.repeat(Math.max(1, word.length));
        return span;
      }

      /** The word opened up: its two sides, its pieces, and its note. */
      function wordBlock(chunk, solved) {
        const block = document.createDocumentFragment();

        const head = document.createElement('div');
        head.className = 'detail-head';
        const target = document.createElement('span');
        target.className = 'tr';
        target.lang = D.target;
        if (solved) target.textContent = chunk.target;
        else target.append(masked(chunk.target));
        const native = document.createElement('span');
        native.className = 'no';
        native.lang = D.native;
        native.textContent = chunk.native;
        head.append(target, native);
        block.append(head);

        if (chunk.morphemes?.length) {
          const strip = document.createElement('div');
          strip.className = 'morphemes';
          chunk.morphemes.forEach((morpheme, index) => {
            if (index > 0) {
              const joint = document.createElement('span');
              joint.className = 'joint';
              joint.textContent = '+';
              strip.append(joint);
            }
            strip.append(morphemeNode(morpheme, solved));
          });
          block.append(strip);
        }

        if (chunk.note) {
          const note = document.createElement('p');
          note.className = 'note';
          note.lang = D.native;
          note.textContent = chunk.note;
          block.append(note);
        }

        return block;
      }

      function renderDetail(chunk) {
        detail.replaceChildren();
        if (!chunk) return;
        detail.append(wordBlock(chunk, isSolved(current.chunks.indexOf(chunk))));

        const inBank = loadBank().some((word) => fold(word.target) === fold(chunk.target));
        if (inBank) {
          const mark = document.createElement('p');
          mark.className = 'detail-actions hint-text';
          mark.textContent = D.inBank;
          detail.append(mark);
        }
      }

      /** Every word with a breakdown or a note, opened up in sentence order. */
      function renderExplanations() {
        explanations.replaceChildren();
        for (const chunk of current.chunks) {
          if (!chunk.morphemes?.length && !chunk.note) continue;
          const block = document.createElement('div');
          block.className = 'explanation';
          block.append(wordBlock(chunk, true));
          explanations.append(block);
        }
        explanations.hidden = explanations.childElementCount === 0;
      }

      function sentenceDone() {
        return (
          current.chunks.length > 0 &&
          [...comparator.children].every((box) => box.classList.contains('correct'))
        );
      }

      /** A word typed right with no hint goes into the bank, or if it is
          there already, has its tally bumped. Only the first time is a drop. */
      function bankEarned(chunk) {
        const words = loadBank();
        const at = words.findIndex((word) => fold(word.target) === fold(chunk.target));
        if (at >= 0) {
          words[at] = { ...words[at], count: (words[at].count ?? 1) + 1 };
          saveBank(words);
          hop();
          return;
        }
        saveBank([
          ...words,
          {
            target: chunk.target,
            native: chunk.native,
            count: 1,
            pieces: chunk.morphemes?.length ?? 0,
            ...(chunk.note ? { note: chunk.note } : {}),
          },
        ]);
        // A chest filled to 25 gets a bigger show.
        fireworks(chunk, (words.length + 1) % CHEST_SIZE === 0 ? 3 : 1);
      }

      /* Fireworks -------------------------------------------------------- */

      const SPARKS = ['✨', '🎉', '⭐', '💎', '🪙', '🔥', '🎊', '💫'];

      /** A burst of emoji and little balls out of the chest; more pieces for
          a longer word. Every third piece is the ball of the language learned. */
      function fireworks(chunk, scale = 1) {
        const count = (10 + Math.min(10, (chunk.morphemes?.length ?? 0) * 3)) * scale;
        for (let at = 0; at < count; at += 1) {
          const spark = document.createElement('span');
          if (at % 3 === 0) spark.append(flag(D.flagTo));
          else spark.textContent = SPARKS[Math.floor(Math.random() * SPARKS.length)];
          // Mostly upward, like a fountain, with some spread to the sides.
          const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 0.9;
          const distance = 60 + Math.random() * 110;
          spark.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
          spark.style.setProperty('--y', `${Math.sin(angle) * distance}px`);
          spark.style.setProperty('--r', `${Math.round(Math.random() * 360 - 180)}deg`);
          spark.style.setProperty('--d', `${Math.round(Math.random() * 200)}ms`);
          spark.style.setProperty('--s', `${(0.9 + Math.random() * 0.7).toFixed(2)}rem`);
          spark.addEventListener('animationend', () => spark.remove());
          fireworksBox.append(spark);
        }
        hop();
      }

      function hop() {
        chest.classList.remove('hop');
        void chest.getBBox();
        chest.classList.add('hop');
      }

      chest.addEventListener('animationend', () => chest.classList.remove('hop'));

      document.addEventListener('keydown', (event) => {
        if (event.ctrlKey || event.altKey || event.metaKey || lessonCard.hidden) return;

        // The . key is a one-letter hint. Punctuation is not checked, so no
        // blank ever needs a full stop typed into it.
        if (event.key === '.') {
          event.preventDefault();
          if (!event.repeat && !hintButton.parentElement.hidden) hintButton.click();
          return;
        }

        // The | key reads the word in focus aloud; pressed twice quickly it
        // reads the whole sentence. No word in either language needs the key,
        // so it can be swallowed even while the caret sits in a blank.
        if (event.key !== '|') return;
        event.preventDefault();
        if (event.repeat) return;
        const now = Date.now();
        const double = now - lastPipe < DOUBLE_TAP_MS;
        lastPipe = double ? 0 : now;
        if (double) {
          speak(current.target);
          return;
        }
        const word = current.chunks[selected]?.target;
        if (word) speak(word);
      });

      /** The shape of a lesson with nothing in it, shown while one is fetched. */
      function renderSkeleton() {
        current = { chunks: [] };
        selected = -1;
        comparator.replaceChildren();
        detail.replaceChildren();
        explanations.replaceChildren();
        explanations.hidden = true;

        naturalLine.replaceChildren(bone('60%'));
        naturalRow.hidden = false;

        for (const width of [3, 6, 4, 7, 5]) {
          const box = document.createElement('div');
          box.className = 'chunk bone-chunk';
          const field = document.createElement('span');
          field.className = 'tr';
          field.style.minWidth = `${width}ch`;
          field.textContent = ' ';
          const under = document.createElement('span');
          under.className = 'no';
          under.append(bone(`${width + 1}ch`));
          box.append(field, under);
          comparator.append(box);
        }

        lessonCard.hidden = false;
      }

      function bone(width) {
        const span = document.createElement('span');
        span.className = 'bone';
        span.style.width = width;
        return span;
      }

      function renderLesson(result) {
        current = result;
        selected = -1;
        comparator.replaceChildren();
        detail.replaceChildren();
        explanations.replaceChildren();
        explanations.hidden = true;
        setReady(false);

        naturalLine.textContent = result.native;
        naturalLine.lang = D.native;
        naturalRow.hidden = false;

        for (const [index, chunk] of result.chunks.entries()) {
          comparator.append(chunkField(chunk, index));
        }

        // With no breakdown there is nothing to line up, so the sentence is
        // shown as one piece rather than pretending to a word-by-word split.
        if (result.chunks.length === 0) {
          const whole = document.createElement('p');
          whole.className = 'chunk';
          whole.lang = D.target;
          whole.style.fontSize = '1.4rem';
          whole.textContent = result.target;
          comparator.append(whole);
        }

        lessonCard.hidden = false;
        focusNextOpen();
      }

      /* Speech -----------------------------------------------------------
         The server reads the sentence with an Azure voice and hands back an
         MP3. If it is not set up there, the browser's own voice steps in. */

      const canSpeakLocally = 'speechSynthesis' in window;
      const DOUBLE_TAP_MS = 400;
      let lastPipe = 0;
      /** Flipped off the first time the server says it has no voice. */
      let serverSpeech = true;
      const player = new Audio();

      function localVoice() {
        const voices = speechSynthesis.getVoices();
        const matching = voices.filter((voice) => voice.lang.toLowerCase().startsWith(D.target));
        return matching.find((voice) => voice.localService) ?? matching[0] ?? null;
      }

      function speakLocally(text) {
        if (!canSpeakLocally) return;
        speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = D.targetLocale;
        utterance.rate = 0.9;
        const voice = localVoice();
        if (voice) utterance.voice = voice;
        speechSynthesis.speak(utterance);
      }

      async function speak(text) {
        if (!text) return;
        player.pause();
        if (canSpeakLocally) speechSynthesis.cancel();

        if (serverSpeech) {
          try {
            const response = await fetch(
              `/api/speak?lang=${D.target}&v=${speechVersion}&text=${encodeURIComponent(text)}`,
            );
            if (response.status === 503) {
              serverSpeech = false;
            } else if (response.ok) {
              const blob = await response.blob();
              player.src = URL.createObjectURL(blob);
              await player.play();
              return;
            } else {
              return;
            }
          } catch {
            // Fall through to the local voice for this one sentence.
          }
        }
        speakLocally(text);
      }

      speakButton.addEventListener('click', () => speak(current.target));

      // A click on nothing in particular is taken as "back to the exercise":
      // the caret goes to the first blank still open. Controls, links, the
      // card itself keep their own behaviour.
      document.addEventListener('click', (event) => {
        if (lessonCard.hidden) return;
        const interactive = event.target.closest(
          'button, a, input, select, textarea, label, [contenteditable], #lesson',
        );
        if (interactive) return;
        focusNextOpen();
      });

      /* Word bank -------------------------------------------------------- */

      /** How far into the current chest of 25 the bank is, and how many
          chests are already full. A bank of exactly 25 shows as a full bar,
          not an empty one. */
      function renderProgress(total) {
        const full = total > 0 && total % CHEST_SIZE === 0 ? total / CHEST_SIZE - 1 : Math.floor(total / CHEST_SIZE);
        const inChest = total - full * CHEST_SIZE;
        progressFill.style.width = `${(inChest / CHEST_SIZE) * 100}%`;
        progressBar.setAttribute('aria-valuenow', String(inChest));
        progressCount.textContent = `${inChest} / ${CHEST_SIZE}`;
        progressFull.textContent = full > 0 ? D.chestsFull(full) : '';
      }

      /** The chest picker: one entry per 25 words, the newest chest last. */
      function renderGroups(total) {
        const groups = Math.max(1, Math.ceil(total / CHEST_SIZE));
        groupSelect.hidden = groups < 2;
        groupSelect.setAttribute('aria-label', D.chest);
        groupSelect.replaceChildren();
        for (let at = 0; at < groups; at += 1) {
          const option = document.createElement('option');
          option.value = String(at);
          const from = at * CHEST_SIZE + 1;
          const to = Math.min(total, (at + 1) * CHEST_SIZE);
          option.textContent = `${D.chest} ${at + 1} · ${from}–${to}`;
          groupSelect.append(option);
        }
        if (viewGroup < 0 || viewGroup >= groups) viewGroup = groups - 1;
        groupSelect.value = String(viewGroup);
        return viewGroup;
      }

      groupSelect.addEventListener('change', () => {
        viewGroup = Number(groupSelect.value);
        renderBank(loadBank());
      });

      function renderBank(words) {
        bankList.replaceChildren();
        bankCount.textContent = words.length ? String(words.length) : '';
        // No chest until there is something in it.
        bank.hidden = words.length === 0;
        renderProgress(words.length);
        chestWrap.dataset.open = String(chestOpen);
        chestToggle.setAttribute('aria-expanded', String(chestOpen));
        chestToggle.setAttribute('aria-label', chestOpen ? D.chestClose : D.chestOpen);
        chestToggle.title = chestOpen ? D.chestClose : D.chestOpen;

        const indexed = words.map((word, index) => [index, word]);
        let shown;
        if (chestOpen) {
          const group = renderGroups(words.length);
          const start = group * CHEST_SIZE;
          shown = indexed.slice(start, start + CHEST_SIZE);
        } else {
          groupSelect.hidden = true;
          shown = indexed.slice(-PEEK).reverse();
        }

        for (const [index, word] of shown) {
          const item = document.createElement('li');
          item.className = rarityOf(word.pieces ?? 0);

          const target = document.createElement('span');
          target.className = 'tr';
          target.lang = D.target;
          target.textContent = word.target;

          const native = document.createElement('span');
          native.className = 'no';
          native.lang = D.native;
          native.textContent = word.native;

          const tally = document.createElement('span');
          tally.className = 'tally';
          tally.textContent = `×${word.count ?? 1}`;
          tally.title = D.tally;

          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'ghost';
          remove.textContent = '−';
          remove.setAttribute('aria-label', D.remove(word.target));
          remove.addEventListener('click', () => {
            saveBank(words.filter((_, at) => at !== index));
            if (selected >= 0) renderDetail(current.chunks[selected]);
          });

          item.append(target, native, tally, remove);
          bankList.append(item);
        }
      }

      /* Fetching --------------------------------------------------------- */

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        // Forward within the history is just a step; past its end is a fetch.
        if (cursor < history.length - 1) {
          showAt(cursor + 1);
          return;
        }

        const attempt = ++pending;
        const asked = learning;
        submitButton.disabled = true;
        submitButton.classList.add('busy');
        setStatus('');
        // Nothing on screen yet: hold the space the sentence will take.
        if (current.chunks.length === 0) renderSkeleton();

        try {
          const response = await fetch('/api/lesson', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              learning,
              level,
              topic: topicField.value.trim(),
              // The recent sentences, so the next one is not one of them.
              avoid: history.slice(-30).map((entry) => entry.target),
            }),
          });
          const result = await response.json().catch(() => ({}));
          // A flip while waiting means this answer belongs to the other side.
          if (attempt !== pending || asked !== learning) return;

          if (!response.ok) {
            setStatus(result.error ?? D.failed, true);
            return;
          }
          history.push(result);
          if (history.length > HISTORY_LIMIT) history.splice(0, history.length - HISTORY_LIMIT);
          cursor = history.length - 1;
          saveHistory();
          renderLesson(result);
          updateSteps();
          setStatus(result.chunks.length === 0 ? D.noBreakdown : '', result.chunks.length === 0);
        } catch {
          if (attempt === pending) setStatus(D.offline, true);
        } finally {
          if (attempt === pending) {
            submitButton.disabled = false;
            submitButton.classList.remove('busy');
          }
        }
      });

      /* Level ------------------------------------------------------------ */

      let level = 'nybegynner';

      function setLevel(value) {
        const [key, label] = D.levels.find(([candidate]) => candidate === value) ?? D.levels[0];
        level = key;
        levelButton.textContent = label;
        levelButton.setAttribute('aria-label', `${D.levelLabel}: ${label}`);
        remember(keyFor('niva'), key);
      }

      levelButton.addEventListener('click', () => {
        const at = D.levels.findIndex(([key]) => key === level);
        setLevel(D.levels[(at + 1) % D.levels.length][0]);
      });

      /* Direction switch ------------------------------------------------- */

      /** The build, fetched once and kept in the tab title. */
      let version = '';
      /** Fingerprint of the voice settings; part of every speech URL so the
       *  browser's cache is bypassed when the voice changes. */
      let speechVersion = '';
      fetch('/api/version')
        .then((response) => (response.ok ? response.json() : null))
        .then((body) => {
          if (typeof body?.speech === 'string') speechVersion = body.speech;
          if (typeof body?.version === 'string') {
            version = body.version;
            setTitle();
            // "0.1.0+5f87809" -> "5f87809"
            document.querySelector('#build').textContent = version.split('+')[1] ?? version;
          }
        })
        .catch(() => {});

      function setTitle() {
        document.title = version ? `${D.title} · ${version}` : D.title;
      }

      /** Writes every label on the page in the learner's own language. */
      function applyDirection() {
        D = DIRECTIONS[learning];
        document.documentElement.lang = D.native;
        setTitle();
        flagFrom.replaceChildren(flag(D.flagFrom));
        flagTo.replaceChildren(flag(D.flagTo));
        speakBall.replaceChildren(flag(D.flagTo));
        setFavicon(D.flagTo);
        directionLabel.textContent = D.label;
        flipButton.title = D.flip;
        flipButton.setAttribute('aria-label', D.flip);
        levelButton.title = D.switchLevel;
        topicField.placeholder = D.topicPlaceholder;
        topicField.setAttribute('aria-label', D.topic);
        // Start on the default theme, and carry it over when flipping, but
        // leave a theme the learner typed themselves alone.
        const defaults = Object.values(DIRECTIONS).map((d) => d.defaultTopic);
        if (!topicField.value.trim() || defaults.includes(topicField.value.trim())) {
          topicField.value = D.defaultTopic;
        }
        speakButton.title = D.speak;
        speakButton.setAttribute('aria-label', D.speak);
        keyHelp.replaceChildren();
        keyHelp.append(kbd('|'), ` ${D.keyHelp[0]} · `, kbd('|'), kbd('|'), ` ${D.keyHelp[1]}`);
        hintButton.replaceChildren(`${D.hint} `, Object.assign(kbd('.'), { className: 'key' }));
        backButton.title = D.prev;
        backButton.setAttribute('aria-label', D.prev);
        document.querySelector('.steps').setAttribute('aria-label', D.browse);
        document.querySelector('#bank .sr-only').textContent = D.bank;
      }

      function kbd(text) {
        const key = document.createElement('kbd');
        key.textContent = text;
        return key;
      }

      function flag(id) {
        const ns = 'http://www.w3.org/2000/svg';
        const svg = document.createElementNS(ns, 'svg');
        const use = document.createElementNS(ns, 'use');
        use.setAttribute('href', `#${id}`);
        svg.append(use);
        return svg;
      }

      /** One ball as a self-contained SVG file, for the tab icon. The symbol
          on the page leans on shared clip and eyes; both are copied in. */
      function ballDataUrl(id) {
        const symbol = document.querySelector(`#${id}`);
        const clip = document.querySelector('#ball-clip');
        const eyes = document.querySelector('#ball-eyes');
        const body = symbol.innerHTML.replace('<use href="#ball-eyes"></use>', eyes.innerHTML);
        const svg =
          `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">` +
          `<defs>${clip.outerHTML}</defs>${body}</svg>`;
        return `data:image/svg+xml,${encodeURIComponent(svg)}`;
      }

      function setFavicon(id) {
        document.querySelector('#favicon').href = ballDataUrl(id);
      }

      /** Switches sides: own labels, own level, own history, own chest. */
      function setDirection(value) {
        learning = value === 'nb' ? 'nb' : 'tr';
        remember(DIRECTION_KEY, learning);
        pending += 1;
        player.pause();
        if (canSpeakLocally) speechSynthesis.cancel();
        submitButton.disabled = false;
        submitButton.classList.remove('busy');
        setStatus('');

        applyDirection();
        setLevel(recall(keyFor('niva')) ?? 'nybegynner');
        renderBank(loadBank());

        history = loadHistory();
        if (history.length) {
          showAt(history.length - 1);
        } else {
          cursor = -1;
          current = { chunks: [] };
          updateSteps();
          form.requestSubmit();
        }
      }

      flipButton.addEventListener('click', () => setDirection(learning === 'tr' ? 'nb' : 'tr'));

      // Come back to the side and sentence that were last on screen. A first
      // visit has nothing to come back to, so it fetches one rather than sit
      // empty.
      setDirection(learning);
    </script>
  </body>
</html>
