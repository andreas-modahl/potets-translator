<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lær tyrkisk — Potets Translator</title>
    <link rel="stylesheet" href="/app.css" />
    <script src="/dev/reload.js"></script>
    <style>
      /* Back and forward through the sentences seen so far. Forward past the
         end of the list asks for a new one. */
      .steps {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        margin-top: 2.5rem;
      }
      /* The small Norwegian word is a fiddly target on a touch screen, so a
         proper button gives the same one-letter hint for the word in focus.
         On a keyboard it doubles as the place the shortcut is written down. */
      /* Tucked behind a ⋯ in the corner, so the card is only the sentence
         until something more is asked for. */
      #lesson {
        position: relative;
      }
      .more {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        width: 2rem;
        height: 2rem;
        padding: 0;
        font-size: 1.1rem;
        line-height: 1;
        border-color: transparent;
      }
      .more[aria-expanded='true'] {
        color: var(--ink);
        background: var(--sunk);
      }
      .hint-row {
        margin-top: 1rem;
      }
      .hint-row button {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.5rem 1rem;
      }
      .hint-row kbd {
        padding: 0.05rem 0.4rem;
        font: inherit;
        font-size: 0.72rem;
        color: var(--faint);
        background: var(--sunk);
        border: 1px solid var(--line);
        border-bottom-width: 2px;
        border-radius: 4px;
      }
      @media (hover: none), (pointer: coarse) {
        .hint-row button {
          width: 100%;
          justify-content: center;
          padding: 0.7rem 1rem;
        }
        .hint-row kbd {
          display: none;
        }
      }

      /* One field for both: the level is a small toggle that lives inside the
         topic input, and cycles through the levels on click. */
      .topic-wrap {
        position: relative;
      }
      .topic-wrap input {
        padding-left: 8.25rem;
      }
      .level {
        position: absolute;
        top: 50%;
        left: 0.4rem;
        transform: translateY(-50%);
        width: 7.4rem;
        padding: 0.3rem 0.6rem;
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: var(--accent);
        background: var(--accent-soft);
        border-color: transparent;
        border-radius: 7px;
      }
      .level:hover {
        border-color: var(--accent);
      }

      /* The word itself stays hidden in the detail panel until it has been
         typed right or asked for; its parts are still described. */
      .hidden-word {
        color: var(--faint);
        letter-spacing: 0.15em;
      }
      .step {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2.9rem;
        height: 2.9rem;
        padding: 0;
      }
      /* While a sentence is being made, the play icon gives way to a ring. */
      .spinner {
        display: none;
        width: 1.1rem;
        height: 1.1rem;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      .step.busy .play-icon {
        display: none;
      }
      .step.busy .spinner {
        display: block;
      }
      .step.busy:disabled {
        opacity: 1;
      }
      @keyframes spin {
        to {
          transform: rotate(1turn);
        }
      }
      .step-count {
        min-width: 3.5rem;
        text-align: center;
        font-size: 0.85rem;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }

      /* The comparator ----------------------------------------------------
         Turkish across the top, each word standing over the Norwegian it
         carries. The Norwegian reads in Turkish order, so it comes out
         scrambled — that mismatch is exactly what there is to learn, and the
         natural Norwegian sentence sits underneath to put it back together. */
      .comparator {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 0.75rem 0.6rem;
        padding: 0.5rem 0;
        /* Room for the ⋯ in the corner. */
        margin-right: 2rem;
      }
      .chunk {
        display: grid;
        gap: 0.15rem;
        justify-items: start;
        padding: 0.4rem 0.5rem;
        border: 1px solid transparent;
        border-radius: 8px;
      }
      .chunk.open {
        background: var(--accent-soft);
        border-color: var(--accent);
      }
      /* The blank to type the Turkish into. A line underneath rather than a
         box, so the row still reads as a sentence and not as a form. */
      .chunk .tr {
        display: block;
        padding: 0 0.1rem;
        font-size: 1.4rem;
        letter-spacing: -0.01em;
        line-height: 1.2;
        white-space: nowrap;
        border-bottom: 2px solid var(--line);
        outline: none;
      }
      .chunk .tr:focus {
        border-bottom-color: var(--accent);
      }
      .chunk.filled .tr {
        border-bottom-color: var(--bad);
      }
      .chunk.correct .tr {
        border-bottom-color: var(--accent);
        color: var(--accent);
      }
      .chunk .no {
        padding: 0;
        font: inherit;
        font-size: 0.85rem;
        color: var(--muted);
        background: transparent;
        border: 0;
        border-radius: 0;
        cursor: pointer;
      }
      .chunk .no:hover {
        color: var(--ink);
        text-decoration: underline;
      }
      /* A word carrying suffixes is marked with a dotted line under its
         Norwegian, so it is visible at a glance which words have something
         inside them to open up. */
      .chunk.built .no {
        text-decoration: underline dotted var(--accent);
        text-underline-offset: 0.22em;
      }

      /* The natural Norwegian sentence stands on its own above the card, so
         the card holds nothing but the Turkish and what it is made of. */
      .natural {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin: 2.5rem 0 1.25rem;
      }
      .speak {
        flex: 0 0 auto;
        width: 2rem;
        height: 2rem;
        padding: 0;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-color: transparent;
      }
      .natural p {
        margin: 0;
        font-size: 1.05rem;
      }

      /* The detail panel for whichever word is selected ------------------- */
      /* Hidden for now: the breakdown is still rendered, so bringing it back
         is a matter of dropping this rule. */
      #detail {
        display: none;
        margin-top: 1.15rem;
        padding-top: 1.15rem;
        border-top: 1px solid var(--line);
      }
      .detail-head {
        display: flex;
        flex-wrap: wrap;
        gap: 0.2rem 0.75rem;
        align-items: baseline;
      }
      .detail-head .tr {
        font-size: 1.3rem;
      }
      .detail-head .no {
        color: var(--muted);
      }

      /* The word taken apart: root, then each suffix, with what it does. */
      .morphemes {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-end;
        gap: 0.35rem 0.2rem;
        margin-top: 0.9rem;
      }
      .morpheme {
        display: grid;
        gap: 0.1rem;
        padding: 0.35rem 0.5rem;
        background: var(--sunk);
        border-radius: 7px;
      }
      .morpheme .form {
        font-weight: 600;
      }
      .morpheme .means {
        font-size: 0.78rem;
        color: var(--muted);
      }
      .joint {
        padding-bottom: 0.4rem;
        color: var(--faint);
      }

      .note {
        margin: 0.9rem 0 0;
        padding-left: 0.85rem;
        border-left: 3px solid var(--accent);
      }

      .detail-actions {
        margin: 1rem 0 0;
      }
      .hint-text {
        font-size: 0.8rem;
        color: var(--faint);
      }

      /* Word bank -------------------------------------------------------- */
      #bank {
        margin-top: 3.5rem;
      }
      #bank header {
        display: flex;
        gap: 0.75rem;
        align-items: center;
      }
      #bank h2 {
        display: flex;
        gap: 0.6rem;
        align-items: center;
        margin: 0 auto 0 0;
      }
      .chest {
        --chest-line: #5a3a22;
        --chest-lid: #a0673c;
        --chest-body: #7c4a2d;
        --chest-latch: #e9c46a;
        display: block;
      }
      @media (prefers-color-scheme: dark) {
        .chest {
          --chest-line: #3a2617;
          --chest-lid: #b8784a;
          --chest-body: #8f5535;
        }
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .bank-count {
        font-size: 1.1rem;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        color: var(--muted);
      }
      .bank-list {
        display: grid;
        gap: 0.5rem;
        margin: 1.25rem 0 0;
        padding: 0;
        list-style: none;
      }
      .bank-list li {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem 0.75rem;
        align-items: baseline;
        padding: 0.5rem 0.75rem;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }
      .bank-list .tr {
        min-width: 7rem;
        font-weight: 600;
      }
      .bank-list .no {
        flex: 1 1 10rem;
        color: var(--muted);
      }
      .bank-list .tally {
        font-size: 0.8rem;
        font-variant-numeric: tabular-nums;
        color: var(--faint);
      }
      .bank-list button {
        width: 1.6rem;
        height: 1.6rem;
        padding: 0;
        font-size: 0.95rem;
        line-height: 1;
      }

      /* Fireworks -------------------------------------------------------
         A word earned outright sends a burst of emoji out of the chest, and
         the chest gives a little hop. Each piece is scattered by custom
         properties set when it is made, so the CSS stays one keyframe. */
      .chest-wrap {
        position: relative;
      }
      .fireworks {
        position: absolute;
        top: 50%;
        left: 50%;
        pointer-events: none;
      }
      .fireworks span {
        position: absolute;
        font-size: var(--s);
        line-height: 1;
        transform: translate(-50%, -50%);
        opacity: 0;
        animation: firework 1.3s cubic-bezier(0.1, 0.8, 0.3, 1) var(--d) both;
      }
      .chest.hop {
        animation: chest-hop 0.6s cubic-bezier(0.2, 1.6, 0.4, 1);
      }
      @keyframes firework {
        0% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(0.4) rotate(0);
        }
        70% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(1) rotate(var(--r));
        }
      }
      @keyframes chest-hop {
        30% {
          transform: translateY(-8px) rotate(-6deg);
        }
        60% {
          transform: translateY(0) rotate(3deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .fireworks span,
        .chest.hop {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <nav class="site-nav">
      <span class="brand" aria-label="Potets Translator">🥔🥔🥔🥔🥔🥔🥔</span>
      <a href="/">Translator</a>
      <a href="/learn" aria-current="page">Lær tyrkisk</a>
    </nav>

    <main>
      <form id="form">
        <div class="topic-wrap">
          <button type="button" id="level" class="level" aria-label="Nivå: Nybegynner" title="Bytt nivå">
            Nybegynner
          </button>
          <input id="topic" aria-label="Tema" placeholder="Tema: på kafé, familie, å reise…" />
        </div>
      </form>

      <p id="status" class="status" hidden></p>

      <div class="natural" id="natural-row" hidden>
        <p id="natural" lang="nb"></p>
        <button type="button" id="speak" class="speak ghost" aria-label="Les opp på tyrkisk" title="Les opp på tyrkisk">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor" />
            <path d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
      </div>

      <article id="lesson" class="card" hidden>
        <button type="button" id="more" class="more ghost" aria-label="Mer" aria-expanded="false" aria-controls="more-panel">
          ⋯
        </button>
        <div class="comparator" id="comparator"></div>
        <div class="hint-row" id="more-panel" hidden>
          <button type="button" id="hint" class="ghost" title="Tasten |">
            Hint: én bokstav <kbd>|</kbd>
          </button>
        </div>
        <div id="detail"></div>
      </article>

      <div class="steps" role="group" aria-label="Bla i setninger">
        <button type="button" id="back" class="step ghost" aria-label="Forrige setning" title="Forrige setning" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
            <path d="M16 4.5v15l-12-7.5z" fill="currentColor" />
          </svg>
        </button>
        <span class="step-count" id="step-count" aria-live="polite"></span>
        <button id="submit" type="submit" form="form" class="step" aria-label="Neste setning" title="Neste setning">
          <svg class="play-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
            <path d="M8 4.5v15l12-7.5z" fill="currentColor" />
          </svg>
          <span class="spinner" aria-hidden="true"></span>
        </button>
      </div>

      <section id="bank">
        <header>
          <h2 class="chest-wrap">
            <span class="fireworks" id="fireworks" aria-hidden="true"></span>
            <svg class="chest" id="chest" viewBox="0 0 48 40" width="44" height="37" aria-hidden="true" focusable="false">
              <!-- lid -->
              <path d="M4 16 C4 7 12 3 24 3 S44 7 44 16 V18 H4 Z" fill="var(--chest-lid)" stroke="var(--chest-line)" stroke-width="2" stroke-linejoin="round" />
              <path d="M16 3.6 V18 M32 3.6 V18" stroke="var(--chest-line)" stroke-width="2" />
              <!-- body -->
              <rect x="4" y="18" width="40" height="19" rx="2" fill="var(--chest-body)" stroke="var(--chest-line)" stroke-width="2" />
              <path d="M16 18 V37 M32 18 V37" stroke="var(--chest-line)" stroke-width="2" />
              <!-- latch -->
              <rect x="20" y="15" width="8" height="9" rx="1.5" fill="var(--chest-latch)" stroke="var(--chest-line)" stroke-width="2" />
              <circle cx="24" cy="20" r="1.4" fill="var(--chest-line)" />
            </svg>
            <span class="sr-only">Ordbank</span>
            <span class="bank-count" id="bank-count"></span>
          </h2>
        </header>
        <ul class="bank-list" id="bank-list"></ul>
      </section>
    </main>


    <script type="module">
      const form = document.querySelector('#form');
      const levelButton = document.querySelector('#level');
      const topicField = document.querySelector('#topic');
      const submitButton = document.querySelector('#submit');
      const backButton = document.querySelector('#back');
      const stepCount = document.querySelector('#step-count');
      const statusLine = document.querySelector('#status');
      const lessonCard = document.querySelector('#lesson');
      const comparator = document.querySelector('#comparator');
      const hintButton = document.querySelector('#hint');
      const moreButton = document.querySelector('#more');
      const morePanel = document.querySelector('#more-panel');

      moreButton.addEventListener('click', () => {
        const open = morePanel.hidden;
        morePanel.hidden = !open;
        moreButton.setAttribute('aria-expanded', String(open));
      });
      const naturalRow = document.querySelector('#natural-row');
      const naturalLine = document.querySelector('#natural');
      const speakButton = document.querySelector('#speak');
      const detail = document.querySelector('#detail');
      const bank = document.querySelector('#bank');
      const bankList = document.querySelector('#bank-list');
      const bankCount = document.querySelector('#bank-count');
      const chest = document.querySelector('#chest');
      const fireworksBox = document.querySelector('#fireworks');

      const LEVEL_KEY = 'potets.tyrkisk.niva';
      const BANK_KEY = 'potets.tyrkisk.ordbank';
      const HISTORY_KEY = 'potets.tyrkisk.historikk';
      /** How many sentences are kept; the oldest fall off the front. */
      const HISTORY_LIMIT = 100;

      /** The lesson on screen, and which of its chunks is open. */
      let current = { chunks: [] };
      let selected = -1;
      /** Every sentence seen, oldest first, and which one is on screen. */
      let history = [];
      let cursor = -1;
      /** Sequence number, so a slow answer cannot overwrite a newer one. */
      let pending = 0;

      function setStatus(message, isError = false) {
        statusLine.textContent = message ?? '';
        statusLine.hidden = !message;
        statusLine.classList.toggle('error', Boolean(isError));
      }

      /* Storage ---------------------------------------------------------- */

      /** Reading and writing both throw in a browser set to block site data. */
      function remember(key, value) {
        try {
          localStorage.setItem(key, value);
        } catch {
          // A saved word is a convenience; the page works without one.
        }
      }

      function recall(key) {
        try {
          return localStorage.getItem(key);
        } catch {
          return null;
        }
      }

      function loadBank() {
        try {
          const parsed = JSON.parse(recall(BANK_KEY) ?? '[]');
          return Array.isArray(parsed) ? parsed.filter((entry) => entry?.turkish) : [];
        } catch {
          return [];
        }
      }

      function saveBank(words) {
        remember(BANK_KEY, JSON.stringify(words));
        renderBank(words);
      }

      function loadHistory() {
        try {
          const parsed = JSON.parse(recall(HISTORY_KEY) ?? '[]');
          return Array.isArray(parsed)
            ? parsed.filter((entry) => entry?.turkish && Array.isArray(entry.chunks))
            : [];
        } catch {
          return [];
        }
      }

      function saveHistory() {
        remember(HISTORY_KEY, JSON.stringify(history));
      }

      /* Stepping through the history ------------------------------------- */

      function updateSteps() {
        backButton.disabled = cursor <= 0;
        stepCount.textContent = history.length ? `${cursor + 1} / ${history.length}` : '';
        submitButton.setAttribute(
          'aria-label',
          cursor < history.length - 1 ? 'Neste setning' : 'Ny setning',
        );
        submitButton.title = submitButton.getAttribute('aria-label');
      }

      function showAt(index) {
        cursor = index;
        renderLesson(history[index]);
        setStatus('');
        updateSteps();
      }

      backButton.addEventListener('click', () => {
        if (cursor > 0) showAt(cursor - 1);
      });

      /* The comparator --------------------------------------------------- */

      /** A word counts as solved once the field holds it, typed or hinted. */
      function isSolved(index) {
        return Boolean(comparator.children[index]?.classList.contains('correct'));
      }

      /** One more letter of the answer than is already right at the start. */
      function hint(index) {
        const chunk = current.chunks[index];
        const box = comparator.children[index];
        const field = box.querySelector('.tr');
        box.classList.add('helped');
        const answer = chunk.turkish;
        const typed = field.textContent.trim();
        let right = 0;
        while (
          right < typed.length &&
          right < answer.length &&
          typed[right].toLocaleLowerCase('tr') === answer[right].toLocaleLowerCase('tr')
        ) {
          right += 1;
        }
        field.textContent = answer.slice(0, Math.min(answer.length, right + 1));
        checkField(field, chunk);
        placeCaretAtEnd(field);
      }

      function placeCaretAtEnd(field) {
        field.focus();
        const range = document.createRange();
        range.selectNodeContents(field);
        range.collapse(false);
        const selection = getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
      }

      function select(index) {
        selected = index;
        for (const [at, box] of [...comparator.children].entries()) {
          box.classList.toggle('open', at === index);
        }
        renderDetail(current.chunks[index]);
      }

      // The hint button works on the selected word, or failing that the
      // first one still open, which is where the caret sits anyway.
      hintButton.addEventListener('click', () => {
        let index = selected >= 0 && !isSolved(selected) ? selected : -1;
        if (index < 0) index = [...comparator.children].findIndex((box) => !box.classList.contains('correct'));
        if (index < 0) return;
        select(index);
        hint(index);
        if (isSolved(index)) focusNextOpen();
      });

      /** After help, the caret goes to the first blank still to be done. */
      function focusNextOpen() {
        const box = [...comparator.children].find((candidate) => !candidate.classList.contains('correct'));
        const field = box?.querySelector('.tr');
        if (field) placeCaretAtEnd(field);
      }


      /** Turkish spelling compared loosely: case and stray spaces do not count,
          but ı/i and the other letters do — that is the thing being learned. */
      function sameWord(typed, answer) {
        return typed.trim().toLocaleLowerCase('tr') === answer.trim().toLocaleLowerCase('tr');
      }

      function checkField(field, chunk) {
        const typed = field.textContent;
        const box = field.parentElement;
        const wasSolved = box.classList.contains('correct');
        box.classList.toggle('correct', sameWord(typed, chunk.turkish));
        box.classList.toggle('filled', typed.trim().length > 0);
        const solvedNow = box.classList.contains('correct');
        if (solvedNow === wasSolved) return;

        // Earned outright — no hint, not shown — so it goes in the bank.
        if (solvedNow && !box.classList.contains('helped')) bankEarned(chunk);
        // Getting it right unmasks the word in the panel underneath.
        if (current.chunks[selected] === chunk) renderDetail(chunk);
      }

      /** The chunk: a blank field to type the Turkish into, standing over the
          Norwegian it should carry. The Norwegian is the button that opens the
          word up — and doing so writes the answer into the field. */
      function chunkField(chunk, index) {
        const box = document.createElement('div');
        box.className = chunk.morphemes?.length ? 'chunk built' : 'chunk';

        const field = document.createElement('span');
        field.className = 'tr';
        field.lang = 'tr';
        field.contentEditable = 'plaintext-only';
        field.spellcheck = false;
        field.setAttribute('role', 'textbox');
        field.setAttribute('aria-label', `Tyrkisk for «${chunk.norwegian}»`);
        // Sized to the answer so the row does not shift as it is filled in.
        field.style.minWidth = `${Math.max(2, chunk.turkish.length)}ch`;

        // The last right letter moves the caret on, so a sentence can be typed
        // straight through without reaching for Enter.
        field.addEventListener('input', () => {
          checkField(field, chunk);
          if (isSolved(index)) focusNextOpen();
        });
        // Enter and Tab both step to the next blank, skipping the Norwegian
        // buttons in between; Shift+Tab steps back.
        field.addEventListener('keydown', (event) => {
          if (event.key !== 'Enter' && event.key !== 'Tab') return;
          const step = event.key === 'Tab' && event.shiftKey ? -1 : 1;
          const next = comparator.children[index + step]?.querySelector('.tr');
          if (!next && event.key === 'Tab') return;
          event.preventDefault();
          if (next) placeCaretAtEnd(next);
          else field.blur();
        });
        field.addEventListener('focus', () => select(index));

        const norwegian = document.createElement('button');
        norwegian.type = 'button';
        norwegian.className = 'no';
        norwegian.textContent = chunk.norwegian;
        norwegian.title = 'Hint: én bokstav til';
        norwegian.tabIndex = -1;
        // Each click gives one more letter; the last one completes the word.
        norwegian.addEventListener('click', () => {
          select(index);
          hint(index);
          if (isSolved(index)) focusNextOpen();
        });

        box.append(field, norwegian);
        return box;
      }

      function morphemeNode({ form, means }, solved) {
        const piece = document.createElement('span');
        piece.className = 'morpheme';

        const formNode = document.createElement('span');
        formNode.className = 'form';
        formNode.lang = 'tr';
        if (solved) formNode.textContent = form;
        else formNode.append(masked(form));

        const meansNode = document.createElement('span');
        meansNode.className = 'means';
        meansNode.textContent = means;

        piece.append(formNode, meansNode);
        return piece;
      }

      /** Dots standing in for a word not yet earned, one per letter. */
      function masked(word) {
        const span = document.createElement('span');
        span.className = 'hidden-word';
        span.textContent = '·'.repeat(Math.max(1, word.length));
        return span;
      }

      function renderDetail(chunk) {
        detail.replaceChildren();
        if (!chunk) return;
        const solved = isSolved(current.chunks.indexOf(chunk));

        const head = document.createElement('div');
        head.className = 'detail-head';

        const turkish = document.createElement('span');
        turkish.className = 'tr';
        turkish.lang = 'tr';
        if (solved) turkish.textContent = chunk.turkish;
        else turkish.append(masked(chunk.turkish));

        const norwegian = document.createElement('span');
        norwegian.className = 'no';
        norwegian.textContent = chunk.norwegian;

        head.append(turkish, norwegian);
        detail.append(head);

        if (chunk.morphemes?.length) {
          const strip = document.createElement('div');
          strip.className = 'morphemes';
          chunk.morphemes.forEach((morpheme, index) => {
            if (index > 0) {
              const joint = document.createElement('span');
              joint.className = 'joint';
              joint.textContent = '+';
              strip.append(joint);
            }
            strip.append(morphemeNode(morpheme, solved));
          });
          detail.append(strip);
        }

        if (chunk.note) {
          const note = document.createElement('p');
          note.className = 'note';
          note.textContent = chunk.note;
          detail.append(note);
        }

        const inBank = loadBank().some(
          (word) => word.turkish.toLocaleLowerCase('tr') === chunk.turkish.toLocaleLowerCase('tr'),
        );
        if (inBank) {
          const mark = document.createElement('p');
          mark.className = 'detail-actions hint-text';
          mark.textContent = 'Ligger i ordbanken';
          detail.append(mark);
        }
      }

      /** A word typed right with no hint goes into the bank, or if it is
          there already, has its tally bumped. Only the first time is a drop. */
      function bankEarned(chunk) {
        const words = loadBank();
        const at = words.findIndex(
          (word) => word.turkish.toLocaleLowerCase('tr') === chunk.turkish.toLocaleLowerCase('tr'),
        );
        if (at >= 0) {
          words[at] = { ...words[at], count: (words[at].count ?? 1) + 1 };
          saveBank(words);
          hop();
          return;
        }
        saveBank([
          ...words,
          {
            turkish: chunk.turkish,
            norwegian: chunk.norwegian,
            count: 1,
            ...(chunk.note ? { note: chunk.note } : {}),
          },
        ]);
        fireworks(chunk);
      }

      /* Fireworks -------------------------------------------------------- */

      const SPARKS = ['✨', '🎉', '⭐', '💎', '🪙', '🔥', '🎊', '💫'];

      /** A burst of emoji out of the chest; more pieces for a longer word. */
      function fireworks(chunk) {
        const count = 10 + Math.min(10, (chunk.morphemes?.length ?? 0) * 3);
        for (let at = 0; at < count; at += 1) {
          const spark = document.createElement('span');
          spark.textContent = SPARKS[Math.floor(Math.random() * SPARKS.length)];
          // Mostly upward, like a fountain, with some spread to the sides.
          const angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 0.9;
          const distance = 60 + Math.random() * 110;
          spark.style.setProperty('--x', `${Math.cos(angle) * distance}px`);
          spark.style.setProperty('--y', `${Math.sin(angle) * distance}px`);
          spark.style.setProperty('--r', `${Math.round(Math.random() * 360 - 180)}deg`);
          spark.style.setProperty('--d', `${Math.round(Math.random() * 200)}ms`);
          spark.style.setProperty('--s', `${(0.9 + Math.random() * 0.7).toFixed(2)}rem`);
          spark.addEventListener('animationend', () => spark.remove());
          fireworksBox.append(spark);
        }
        hop();
      }

      function hop() {
        chest.classList.remove('hop');
        void chest.getBBox();
        chest.classList.add('hop');
      }

      chest.addEventListener('animationend', () => chest.classList.remove('hop'));

      document.addEventListener('keydown', (event) => {
        // The | key is the hint. No Turkish word contains it, so it can be
        // swallowed even while the caret sits in a blank.
        if (event.key === '|' && !event.ctrlKey && !event.altKey && !event.metaKey && !lessonCard.hidden) {
          event.preventDefault();
          hintButton.click();
        }
      });

      function renderLesson(result) {
        current = result;
        selected = -1;
        comparator.replaceChildren();
        detail.replaceChildren();

        naturalLine.textContent = result.norwegian;
        naturalRow.hidden = false;

        for (const [index, chunk] of result.chunks.entries()) {
          comparator.append(chunkField(chunk, index));
        }

        // With no breakdown there is nothing to line up, so the Turkish is
        // shown as one piece rather than pretending to a word-by-word split.
        if (result.chunks.length === 0) {
          const whole = document.createElement('p');
          whole.className = 'chunk';
          whole.lang = 'tr';
          whole.style.fontSize = '1.4rem';
          whole.textContent = result.turkish;
          comparator.append(whole);
        }

        lessonCard.hidden = false;
        focusNextOpen();
        speak(result.turkish);
      }

      /* Speech -----------------------------------------------------------
         The server reads the sentence with an Azure voice and hands back an
         MP3. If it is not set up there, the browser's own voice steps in. */

      const canSpeakLocally = 'speechSynthesis' in window;
      /** Flipped off the first time the server says it has no voice. */
      let serverSpeech = true;
      const player = new Audio();

      function turkishVoice() {
        const voices = speechSynthesis.getVoices();
        const turkish = voices.filter((voice) => voice.lang.toLowerCase().startsWith('tr'));
        return turkish.find((voice) => voice.localService) ?? turkish[0] ?? null;
      }

      function speakLocally(text) {
        if (!canSpeakLocally) return;
        speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'tr-TR';
        utterance.rate = 0.9;
        const voice = turkishVoice();
        if (voice) utterance.voice = voice;
        speechSynthesis.speak(utterance);
      }

      async function speak(text) {
        if (!text) return;
        player.pause();
        if (canSpeakLocally) speechSynthesis.cancel();

        if (serverSpeech) {
          try {
            const response = await fetch(`/api/speak?text=${encodeURIComponent(text)}`);
            if (response.status === 503) {
              serverSpeech = false;
            } else if (response.ok) {
              const blob = await response.blob();
              player.src = URL.createObjectURL(blob);
              await player.play();
              return;
            } else {
              return;
            }
          } catch {
            // Fall through to the local voice for this one sentence.
          }
        }
        speakLocally(text);
      }

      speakButton.addEventListener('click', () => speak(current.turkish));

      // A click on nothing in particular is taken as "back to the exercise":
      // the caret goes to the first blank still open. Controls, links, the
      // card itself keep their own behaviour.
      document.addEventListener('click', (event) => {
        if (lessonCard.hidden) return;
        const interactive = event.target.closest(
          'button, a, input, select, textarea, label, [contenteditable], #lesson',
        );
        if (interactive) return;
        focusNextOpen();
      });

      /* Word bank -------------------------------------------------------- */

      function renderBank(words) {
        bankList.replaceChildren();
        bankCount.textContent = words.length ? String(words.length) : '';

        for (const [index, word] of words.entries()) {
          const item = document.createElement('li');

          const turkish = document.createElement('span');
          turkish.className = 'tr';
          turkish.lang = 'tr';
          turkish.textContent = word.turkish;

          const norwegian = document.createElement('span');
          norwegian.className = 'no';
          norwegian.textContent = word.norwegian;

          const tally = document.createElement('span');
          tally.className = 'tally';
          tally.textContent = `×${word.count ?? 1}`;
          tally.title = 'Ganger skrevet riktig uten hjelp';

          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'ghost';
          remove.textContent = '−';
          remove.setAttribute('aria-label', `Fjern ${word.turkish}`);
          remove.addEventListener('click', () => {
            saveBank(words.filter((_, at) => at !== index));
            if (selected >= 0) renderDetail(current.chunks[selected]);
          });

          item.append(turkish, norwegian, tally, remove);
          bankList.append(item);
        }
      }

      /* Fetching --------------------------------------------------------- */

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        // Forward within the history is just a step; past its end is a fetch.
        if (cursor < history.length - 1) {
          showAt(cursor + 1);
          return;
        }

        const attempt = ++pending;
        submitButton.disabled = true;
        submitButton.classList.add('busy');
        setStatus('');

        try {
          const response = await fetch('/api/lesson', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ level, topic: topicField.value.trim() }),
          });
          const result = await response.json().catch(() => ({}));
          if (attempt !== pending) return;

          if (!response.ok) {
            setStatus(result.error ?? 'Noe gikk galt.', true);
            return;
          }
          history.push(result);
          if (history.length > HISTORY_LIMIT) history.splice(0, history.length - HISTORY_LIMIT);
          cursor = history.length - 1;
          saveHistory();
          renderLesson(result);
          updateSteps();
          setStatus(
            result.chunks.length === 0
              ? 'Setningen kom, men oppdelingen stemte ikke med den, så den er utelatt. Prøv en gang til.'
              : '',
            result.chunks.length === 0,
          );
        } catch {
          if (attempt === pending) setStatus('Fikk ikke kontakt med serveren.', true);
        } finally {
          if (attempt === pending) {
            submitButton.disabled = false;
            submitButton.classList.remove('busy');
          }
        }
      });

      /* Level ------------------------------------------------------------ */

      const LEVELS = [
        ['nybegynner', 'Nybegynner'],
        ['viderekommen', 'Viderekommen'],
        ['avansert', 'Avansert'],
      ];
      let level = LEVELS[0][0];

      function setLevel(value) {
        const [key, label] = LEVELS.find(([candidate]) => candidate === value) ?? LEVELS[0];
        level = key;
        levelButton.textContent = label;
        levelButton.setAttribute('aria-label', `Nivå: ${label}`);
        remember(LEVEL_KEY, key);
      }

      levelButton.addEventListener('click', () => {
        const at = LEVELS.findIndex(([key]) => key === level);
        setLevel(LEVELS[(at + 1) % LEVELS.length][0]);
      });

      setLevel(recall(LEVEL_KEY) ?? level);
      renderBank(loadBank());

      // Come back to the sentence that was last on screen, not a blank page.
      history = loadHistory();
      if (history.length) showAt(history.length - 1);
      else updateSteps();
    </script>
  </body>
</html>
