# Render blueprint: https://render.com/docs/blueprint-spec
# In the Render dashboard choose New -> Blueprint, point it at this repository,
# and fill in the two keys when asked. Everything else is set here.
services:
  - type: web
    name: potets-translator
    runtime: node
    # Starter: no sleeping, and a disk can be attached. The disk keeps the
    # lesson pool and the generated speech across deploys.
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run web:start
    healthCheckPath: /
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    # DNS is set up at the registrar (see README, "Custom domain").
    domains:
      - languageballs.com
      - www.languageballs.com
      - languageballs.net
      - www.languageballs.net
    envVars:
      - key: NODE_ENV
        value: production
      - key: CANONICAL_HOST
        value: languageballs.com
      # Lessons are pooled and served to many learners, so each one is worth
      # making well: Sonnet, the code's default. Haiku (claude-haiku-4-5-20251001)
      # is about a third of the price and passes the checks too, if cost bites.
      - key: CLAUDE_MODEL
        value: claude-sonnet-5
      - key: WEB_PORT
        value: 10000
      - key: LESSON_DB
        value: /var/data/lessons.db
      - key: SPEECH_CACHE_DIR
        value: /var/data/speech
      - key: PICTURE_CACHE_DIR
        value: /var/data/pictures
      - key: RECRAFT_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        value: northeurope
      # Sign in with Google (see .env.example for the OAuth client set-up).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
