# Render blueprint: https://render.com/docs/blueprint-spec
# In the Render dashboard choose New -> Blueprint, point it at this repository,
# and fill in the two keys when asked. Everything else is set here.
services:
  - type: web
    name: potets-translator
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run web:start
    healthCheckPath: /
    # DNS is set up at the registrar (see README, "Custom domain").
    domains:
      - languageballs.com
      - www.languageballs.com
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_PORT
        value: 10000
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AZURE_SPEECH_KEY
        sync: false
      - key: AZURE_SPEECH_REGION
        value: northeurope
